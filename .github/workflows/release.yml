# Builds the portable zip and per-user installer, then creates a DRAFT GitHub Release
# whenever a version tag (e.g. v0.1.0) is pushed or the workflow is manually dispatched
# with a v* tag. The draft carries the assets and auto-generated notes as a starting
# point; writing the final release notes and publishing the release are done manually.
# The in-app updater reads the same <Version>, so the tag must match Gauge.csproj's
# <Version> prefixed with "v" (and the updater only sees it once published).
#
# Local alternative: pwsh -File release.ps1 -Draft (see README).
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v0.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: pwsh
        run: |
          $tag = '${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^v[0-9]+(\.[0-9]+){1,3}$') {
            throw "Release tag must look like v0.1.1, got '$tag'."
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build portable zip
        run: pwsh -File build-portable.ps1

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pwsh -File build-installer.ps1

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates a DRAFT release with the assets and auto-generated notes as a
        # starting point — final notes and publishing are done manually. Idempotent: if a
        # release/draft for this tag already exists (e.g. created locally by release.ps1,
        # whose tag push also triggers this workflow), just replace the assets instead of
        # failing.
        run: >
          gh release create "$env:RELEASE_TAG" dist/GaugeSetup-win-x64.exe
          dist/GaugePortable-win-x64.zip
          --title "$env:RELEASE_TAG" --draft --generate-notes
          || gh release upload "$env:RELEASE_TAG" dist/GaugeSetup-win-x64.exe
          dist/GaugePortable-win-x64.zip --clobber
